name: Pipeline automatizada de Testes de API

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Executar Testes Automatizados
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env
        env:
          GIT_SECRETS: ${{ secrets.GIT_SECRETS }}
        run: |
          if [ -z "$GIT_SECRETS" ]; then
            echo "::error::A secret GIT_SECRETS não está configurada no repositório!"
            exit 1
          fi
          echo "$GIT_SECRETS" > .env

      - name: Subir servidor da aplicação
        run: npm start > api.log 2>&1 &

      - name: Checar disponibilidade da API
        run: npx wait-on http://127.0.0.1:3000 -t 30000

      - name: Executar testes automatizados
        run: npm test

      - name: Exibir logs da API em caso de falha
        if: failure()
        run: cat api.log || true